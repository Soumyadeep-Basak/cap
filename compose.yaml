services:
  postgres:
    image: postgres:16.6
    container_name: ai-invoice-auditor-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-invoice_auditor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - invoice-net

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: ai-invoice-auditor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -en 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'healthz check passed' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - invoice-net

  redis:
    image: redis:7.4
    container_name: ai-invoice-auditor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - invoice-net

  mock-erp:
    build:
      context: .
      dockerfile: mock_erp/Dockerfile
    image: ai-invoice-auditor-mock-erp:1.0
    container_name: ai-invoice-auditor-mock-erp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - invoice-net

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      MOCK_ERP_BASE_URL: http://mock-erp:8000/api/v1/erp
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      INCOMING_DIR: /app/data/incoming
      MONITOR_POLL_INTERVAL_SECONDS: 30
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./runtime/incoming:/app/data/incoming
      - ./runtime/outputs:/app/outputs
      - /home/labuser/.aws/credentials:/run/aws/credentials:ro
    group_add:
      - "1009"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - invoice-net

  streamlit-ui:
    build:
      context: .
      dockerfile: streamlit-ui/Dockerfile
    image: ai-invoice-auditor-streamlit-ui:1.0
    container_name: ai-invoice-auditor-streamlit-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      AGENT_API_URL: http://agent:8000
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - invoice-net

volumes:
  postgres_data:
  qdrant_data:

networks:
  invoice-net:
    driver: bridge
