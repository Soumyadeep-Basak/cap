
services:
  postgres:
    image: postgres:16.6
    container_name: ai-invoice-auditor-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-invoice_auditor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - invoice-net

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: ai-invoice-auditor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -en 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'healthz check passed' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - invoice-net

  redis:
    image: redis:7.4
    container_name: ai-invoice-auditor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - invoice-net

  mock-erp:
    build:
      context: .
      dockerfile: mock_erp/Dockerfile
    image: ai-invoice-auditor-mock-erp:1.0
    container_name: ai-invoice-auditor-mock-erp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - invoice-net

  # --------------------------------------------------
  # Extractor MCP Server
  # --------------------------------------------------
  extractor-mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-extractor-mcp
    restart: unless-stopped
    environment:
      INCOMING_DIR: /app/data/incoming
    command:
      [
        "python",
        "-m",
        "invoice_auditor.agents.Invoice_Extractor_Agent.mcp_tool_server.main",
      ]
    ports:
      - "8002:8002"
    volumes:
      - ./runtime/incoming:/app/data/incoming:ro
    group_add:
      - "1009"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8002), timeout=5); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - invoice-net

    # --------------------------------------------------
  # Invoice Validation MCP Server
  # --------------------------------------------------
  validation-mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-validation-mcp
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "invoice_auditor.agents.Invoice_Validation_Agent.mcp_tool_server.main",
      ]
    ports:
      - "8003:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8003), timeout=5); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Reporting MCP Server
  # --------------------------------------------------
  reporting-mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-reporting-mcp
    restart: unless-stopped

    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REPORT_OUTPUT_DIR: /app/outputs/reports

    command:
      [
        "python",
        "-m",
        "invoice_auditor.agents.Invoice_Reporting_Agent.mcp_tool_server.main",
      ]

    ports:
      - "8005:8005"

    volumes:
      - ./runtime/outputs:/app/outputs

    group_add:
      - "1009"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8005), timeout=5); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net
  
  # --------------------------------------------------
  # Invoice Translation MCP Server
  # --------------------------------------------------
  translation-mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-translation-mcp
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: ""
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      BEDROCK_LANGUAGE_MODEL_ID: ${BEDROCK_LANGUAGE_MODEL_ID:-amazon.nova-lite-v1:0}
      BEDROCK_TRANSLATION_MODEL_ID: ${BEDROCK_TRANSLATION_MODEL_ID:-amazon.nova-lite-v1:0}
      TRANSLATION_MCP_HOST: 0.0.0.0
      TRANSLATION_MCP_PORT: 8004

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Translation_Agent.mcp_tool_server.main

    ports:
      - "8004:8004"

    volumes:
      - ${HOME}/.aws/credentials:/run/aws/credentials:ro

    group_add:
      - "1009"
      - "${AWS_CREDENTIALS_GID:-1005}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8004), timeout=5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Monitoring MCP Server
  # --------------------------------------------------
  monitoring-mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-monitoring-mcp
    restart: unless-stopped

    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      INCOMING_DIR: /app/data/incoming
      MONITORING_MCP_HOST: 0.0.0.0
      MONITORING_MCP_PORT: 8006

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Monitoring_Agent.mcp_tool_server.main

    ports:
      - "8006:8006"

    volumes:
      - ./runtime/incoming:/app/data/incoming:ro

    group_add:
      - "1009"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8006), timeout=5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Business Validation MCP Server
  # --------------------------------------------------
  business-validation-mcp:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-business-validation-mcp
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MOCK_ERP_BASE_URL: http://mock-erp:8000/api/v1/erp
      BUSINESS_VALIDATION_MCP_HOST: 0.0.0.0
      BUSINESS_VALIDATION_MCP_PORT: 8007

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Business_Validation_Agent.mcp_tool_server.main

    ports:
      - "8007:8007"

    depends_on:
      mock-erp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8007), timeout=5); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Main Agent
  # --------------------------------------------------
  agent:
    build: &agent_build
      context: .
      dockerfile: agent/Dockerfile
    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-agent
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      MOCK_ERP_BASE_URL: http://mock-erp:8000/api/v1/erp
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      RAG_MCP_URL: http://rag-mcp:9010/mcp
      INCOMING_DIR: /app/data/incoming
      EXTRACTOR_MCP_URL: http://extractor-mcp:8002/mcp
      VALIDATION_MCP_URL: http://validation-mcp:8003/mcp
      REPORTING_MCP_URL: http://reporting-mcp:8005/mcp
      REPORT_OUTPUT_DIR: /app/outputs/reports
      TRANSLATION_MCP_URL: http://translation-mcp:8004/mcp
      MONITORING_MCP_URL: http://monitoring-mcp:8006/mcp
      BUSINESS_VALIDATION_MCP_URL: http://business-validation-mcp:8007/mcp
      MONITORING_A2A_URL: http://monitoring-a2a:8010
      EXTRACTOR_A2A_URL: http://extractor-a2a:8011
      TRANSLATION_A2A_URL: http://translation-a2a:8012
      VALIDATION_A2A_URL: http://validation-a2a:8013
      REPORTING_A2A_URL: http://reporting-a2a:8015
      BUSINESS_VALIDATION_A2A_URL: http://business-validation-a2a:8014
      MONITOR_POLL_INTERVAL_SECONDS: 30
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./runtime/incoming:/app/data/incoming
      - ./runtime/outputs:/app/outputs
      - ${HOME}/.aws/credentials:/run/aws/credentials:ro
    group_add:
      - "1009"
      - "${AWS_CREDENTIALS_GID:-1005}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
      extractor-a2a:
        condition: service_healthy
      validation-a2a:
        condition: service_healthy
      reporting-a2a:
        condition: service_healthy
      translation-a2a:
        condition: service_healthy
      monitoring-a2a:
        condition: service_healthy
      business-validation-a2a:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Monitoring A2A Server
  # --------------------------------------------------
  monitoring-a2a:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-monitoring-a2a
    restart: unless-stopped

    environment:
      MONITORING_A2A_HOST: 0.0.0.0
      MONITORING_A2A_PORT: 8010
      MONITORING_A2A_PUBLIC_URL: http://monitoring-a2a:8010
      MONITORING_MCP_URL: http://monitoring-mcp:8006/mcp

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Monitoring_Agent.a2a_agent.main

    ports:
      - "127.0.0.1:8010:8010"

    depends_on:
      monitoring-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Extractor A2A Server
  # --------------------------------------------------
  extractor-a2a:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-extractor-a2a
    restart: unless-stopped

    environment:
      EXTRACTOR_A2A_HOST: 0.0.0.0
      EXTRACTOR_A2A_PORT: 8011
      EXTRACTOR_A2A_PUBLIC_URL: http://extractor-a2a:8011
      EXTRACTOR_MCP_URL: http://extractor-mcp:8002/mcp

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Extractor_Agent.a2a_agent.main

    ports:
      - "127.0.0.1:8011:8011"

    depends_on:
      extractor-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Translation A2A Server
  # --------------------------------------------------
  translation-a2a:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-translation-a2a
    restart: unless-stopped

    environment:
      TRANSLATION_A2A_HOST: 0.0.0.0
      TRANSLATION_A2A_PORT: 8012
      TRANSLATION_A2A_PUBLIC_URL: http://translation-a2a:8012
      TRANSLATION_MCP_URL: http://translation-mcp:8004/mcp

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Translation_Agent.a2a_agent.main

    ports:
      - "127.0.0.1:8012:8012"

    depends_on:
      translation-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Data Validation A2A Server
  # --------------------------------------------------
  validation-a2a:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-validation-a2a
    restart: unless-stopped

    environment:
      VALIDATION_A2A_HOST: 0.0.0.0
      VALIDATION_A2A_PORT: 8013
      VALIDATION_A2A_PUBLIC_URL: http://validation-a2a:8013
      VALIDATION_MCP_URL: http://validation-mcp:8003/mcp

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Validation_Agent.a2a_agent.main

    ports:
      - "127.0.0.1:8013:8013"

    depends_on:
      validation-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Business Validation A2A Server
  # --------------------------------------------------
  business-validation-a2a:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-business-validation-a2a
    restart: unless-stopped

    environment:
      BUSINESS_VALIDATION_A2A_HOST: 0.0.0.0
      BUSINESS_VALIDATION_A2A_PORT: 8014
      BUSINESS_VALIDATION_A2A_PUBLIC_URL: http://business-validation-a2a:8014
      BUSINESS_VALIDATION_MCP_URL: http://business-validation-mcp:8007/mcp

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Business_Validation_Agent.a2a_agent.main

    ports:
      - "127.0.0.1:8014:8014"

    depends_on:
      business-validation-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  # --------------------------------------------------
  # Invoice Reporting A2A Server
  # --------------------------------------------------
  reporting-a2a:
    build:
      context: .
      dockerfile: agent/Dockerfile

    image: ai-invoice-auditor-agent:1.0
    container_name: ai-invoice-auditor-reporting-a2a
    restart: unless-stopped

    environment:
      REPORTING_A2A_HOST: 0.0.0.0
      REPORTING_A2A_PORT: 8015
      REPORTING_A2A_PUBLIC_URL: http://reporting-a2a:8015
      REPORTING_MCP_URL: http://reporting-mcp:8005/mcp

    command:
      - python
      - -m
      - invoice_auditor.agents.Invoice_Reporting_Agent.a2a_agent.main

    ports:
      - "127.0.0.1:8015:8015"

    depends_on:
      reporting-mcp:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - invoice-net

  rag-mcp:
    build: *agent_build
    image: ai-invoice-auditor-agent:1.0
    command:
      - uvicorn
      - invoice_auditor.agents.Invoice_RAG_Agent.mcp_tool_server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "9010"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    volumes:
      - ${HOME}/.aws/credentials:/run/aws/credentials:ro
    group_add:
      - "1009"
      - "${AWS_CREDENTIALS_GID:-1005}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9010/health', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - invoice-net

  # ---------------------------------------------------------------
  # Streamlit-ui
  # ---------------------------------------------------------------
  streamlit-ui:
    build:
      context: .
      dockerfile: streamlit-ui/Dockerfile
    image: ai-invoice-auditor-streamlit-ui:1.0
    container_name: ai-invoice-auditor-streamlit-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_auditor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      AGENT_API_URL: http://agent:8000
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - invoice-net

volumes:
  postgres_data:
  qdrant_data:

networks:
  invoice-net:
    driver: bridge
